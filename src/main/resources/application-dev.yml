spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/preparex
    username: postgres
    password: Prat@2002

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password:

  redisson:
    config: |
      singleServerConfig:
        address: "redis://localhost:6379"

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: preparex-dev
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  auth:
    jwt:
      secret: dev-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 7
    session:
      max-active-sessions: 2
    otp:
      expiry-minutes: 5
      max-retries: 5
      resend-cooldown-seconds: 60
    registration:
      temp-data-ttl-minutes: 10
    google:
      client-id: your-google-client-id-here

spring.mail:
  host: smtp.gmail.com
  port: 587
  username: dev@preparex.com
  password: dev-mail-password

logging:
  level:
    com.preparex: DEBUG
    org.springframework.security: DEBUG
